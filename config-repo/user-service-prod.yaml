server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DB}

jwt:
  keys:
    private-key-path: ${JWT_PRIVATE_KEY}
    public-key-path: ${JWT_PUBLIC_KEY}
  expiration:
    access-ms: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-ms: ${JWT_REFRESH_EXPIRATION_MS}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
