server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/userdb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VHOST:/}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}

app:
  rabbitmq:
    exchanges:
      user-events:
        name: ${USER_EVENTS_EXCHANGE:user.events.exchange}
        type: direct
    queues:
      phone-verification:
        name: ${PHONE_VERIFICATION_QUEUE:phone.verification.queue}
        bindings:
          phone-verification-requested:
            exchange: user-events
            routing-key: ${PHONE_VERIFICATION_ROUTING_KEY:phone-verification-requested}

  redis:
    keys:
      signup-request:
        key: ${REDIS_KEY_SIGNUP_REQUEST:signup:request}
        ttl-ms: ${REDIS_TTL_SIGNUP_REQUEST:300000}
      phone-verification-code:
        key: ${REDIS_KEY_PHONE_VERIFICATION_CODE:phone:verification:code}
        ttl-ms: ${REDIS_TTL_PHONE_VERIFICATION_CODE:300000}
      phone-verification-rate-limit:
        key: ${REDIS_KEY_PHONE_VERIFICATION_RATE_LIMIT:phone:verification:rate-limit}
        ttl-ms: ${REDIS_TTL_PHONE_VERIFICATION_RATE_LIMIT:60000}
      phone-verification-attempts:
        key: ${REDIS_KEY_PHONE_VERIFICATION_ATTEMPTS:phone:verification:attempts}
        ttl-ms: ${REDIS_TTL_PHONE_VERIFICATION_ATTEMPTS:3600000}

  jwt:
    keys:
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    expiration:
      access-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-ms: ${JWT_REFRESH_EXPIRATION_MS:1296000000}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
