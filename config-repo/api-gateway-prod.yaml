server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB}
  cloud:
    gateway:
      routes:
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: auth-signIn
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/signIn
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        - id: auth-signUp
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/signUp
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1

        - id: auth-confirmSignUp
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/confirmSignUp
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1

        - id: auth-refresh
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/refresh
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: user-service-addresses
          uri: lb://user-service
          predicates:
            - Path=/api/v1/address/**

        - id: restaurant-service-restaurants
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurants/**

        - id: order-service-orders
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**

app:
  frontend:
    host: ${FRONTEND_HOST}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never