server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Order Service
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # Restaurant Service
        - id: restaurant-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/restaurants/**
          filters:
            - StripPrefix=0

# Actuator для мониторинга Gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always