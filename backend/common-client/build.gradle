plugins {
    id 'java'
}

group = 'org.vovgoo'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":backend:common-domain")
    implementation project(":backend:common-config")
    implementation 'io.github.openfeign:feign-slf4j:13.6'
    implementation 'org.springframework.cloud:spring-cloud-openfeign-core:5.0.0'
    implementation 'org.springframework.retry:spring-retry:2.0.12'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

test {
    useJUnitPlatform()
}