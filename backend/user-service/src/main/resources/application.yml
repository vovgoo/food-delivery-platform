spring:
  application:
    name: user-service

  jackson:
    serialization:
      indent_output: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

jwt:
  secret: ${JWT_SECRET:defaultsecret}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
