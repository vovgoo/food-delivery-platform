spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/userdb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: false

jwt:
  secret: ${JWT_SECRET:devsecret}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
